<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NATI Accounting – Sign in</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 40px 36px;
    }
    .login-logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      width: 56px; height: 56px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .login-eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--text-2);
    }
    .login-form { display: flex; flex-direction: column; gap: 14px; }
    .login-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 5px;
    }
    .login-field input {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .login-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .login-field input::placeholder { color: var(--text-3); }
    .login-error {
      display: none;
      font-size: 13px;
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      padding: 10px 13px;
    }
    .login-submit {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: background 0.12s, transform 0.1s;
      margin-top: 4px;
    }
    .login-submit:hover  { background: var(--accent-h); }
    .login-submit:active { transform: scale(0.98); }
    .login-footer {
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo-wrap">
      <img src="logo.jpg" alt="NATI" class="login-logo">
      <p class="login-eyebrow">NATI Accounting</p>
      <h1 class="login-title">Sign in</h1>
      <p class="login-sub">Bills, P&amp;L, and drops — all in one place.</p>
    </div>
    <form id="login-form" class="login-form">
      <div class="login-field">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="accounting@nati.in" autocomplete="email">
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="login-error" class="login-error"></div>
      <button type="submit" class="login-submit">
        <i class="fas fa-arrow-right-to-bracket"></i>
        <span>Sign in</span>
      </button>
    </form>
    <p class="login-footer">Need access? Ask the admin to create an account for you.</p>
  </div>
  <script src="js/login.js" defer></script>
</body>
</html>
