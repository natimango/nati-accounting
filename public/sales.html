<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4f46e5">
    <title>Sales Revenue — NATI Accounting</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .ch-badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
        .ch-D2C_WEBSITE  { background:#ede9fe; color:#7c3aed; }
        .ch-MYNTRA       { background:#fce7f3; color:#be185d; }
        .ch-AJIO         { background:#dcfce7; color:#166534; }
        .ch-NYKAA        { background:#fef3c7; color:#92400e; }
        .ch-INSTAGRAM    { background:#fce7f3; color:#9d174d; }
        .ch-POPUP        { background:#e0f2fe; color:#0369a1; }
        .ch-OTHER        { background:#f3f4f6; color:#374151; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .form-field label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
        .form-field input, .form-field select {
            width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px;
            font-size: 13px; background: #fff; color: #1e293b;
        }
        .form-field input:focus, .form-field select:focus {
            outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.12);
        }
        .rt { width: 100%; border-collapse: collapse; font-size: 13px; }
        .rt th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #94a3b8; background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        .rt th.tr, .rt td.tr { text-align: right; }
        .rt td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; color: #374151; }
        .rt tr:hover td { background: #f8fafc; }
        .rt .pos { color: #059669; font-weight: 600; }
        .rt .neg { color: #dc2626; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .kpi { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; }
        .kpi .label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
        .kpi .value { font-size: 20px; font-weight: 700; color: #1e293b; margin-top: 4px; }
        .kpi.green .value { color: #059669; }
        .kpi.red .value   { color: #dc2626; }
        .ch-bar-track { height: 6px; border-radius: 99px; background: #f1f5f9; overflow: hidden; margin-top: 6px; }
        .ch-bar-fill  { height: 100%; border-radius: 99px; background: #6366f1; }
    </style>
</head>
<body>
<div class="app-layout">
<div class="app-content">
<header class="app-topbar">
  <button class="topbar-toggle" id="topbar-toggle"><i class="fas fa-bars"></i></button>
  <span class="topbar-title">Sales Revenue</span>
  <div class="topbar-right" id="topbar-right"></div>
</header>
<div class="app-main">
<!-- KPI row -->
            <div class="kpi-grid">
                <div class="kpi"><div class="label">Gross Sales</div><div class="value" id="kpiGross">—</div></div>
                <div class="kpi red"><div class="label">Returns</div><div class="value" id="kpiReturns">—</div></div>
                <div class="kpi green"><div class="label">Net Revenue</div><div class="value" id="kpiNet">—</div></div>
                <div class="kpi"><div class="label">GST Collected</div><div class="value" id="kpiGst">—</div></div>
                <div class="kpi"><div class="label">Net Units Sold</div><div class="value" id="kpiUnits">—</div></div>
            </div>

            <!-- Channel breakdown -->
            <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
                <h3 class="font-semibold text-sm mb-4">By Channel</h3>
                <div id="channelGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
            </div>

            <!-- Filters & table -->
            <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center gap-3">
                    <span class="text-sm font-semibold text-slate-700 mr-1">Entries</span>
                    <input type="date" id="fStart" class="px-2 py-1.5 border border-slate-300 rounded-lg text-sm">
                    <span class="text-slate-400 text-sm">to</span>
                    <input type="date" id="fEnd"   class="px-2 py-1.5 border border-slate-300 rounded-lg text-sm">
                    <select id="fDrop" class="px-2 py-1.5 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="">All drops</option>
                    </select>
                    <button onclick="loadEntries()" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">Apply</button>
                    <div class="ml-auto flex items-center gap-2">
                        <button onclick="exportCSV()" class="px-3 py-1.5 border border-slate-300 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50 flex items-center gap-1.5">
                            <i class="fas fa-download text-xs"></i> CSV
                        </button>
                        <button onclick="openAddForm()" class="px-4 py-1.5 bg-slate-900 text-white rounded-lg text-sm font-semibold hover:bg-slate-700 flex items-center gap-2">
                            <i class="fas fa-plus text-xs"></i> Add Entry
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="rt">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Channel</th>
                                <th>Drop</th>
                                <th>Section</th>
                                <th class="tr">Gross Sales</th>
                                <th class="tr">Returns</th>
                                <th class="tr">Net Sales</th>
                                <th class="tr">Units</th>
                                <th class="tr">GST</th>
                                <th>Settlement</th>
                                <th class="tr">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="entriesBody">
                            <tr><td colspan="11" class="text-center py-10 text-slate-400">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
</div>
</div>
</div>

<!-- ── Add Entry modal ── -->
<div id="add-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
            <h3 class="font-semibold text-slate-900" id="modal-title">Record Sales Entry</h3>
            <button onclick="closeAddForm()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 space-y-5">
            <!-- Core -->
            <div class="form-row">
                <div class="form-field">
                    <label>Date *</label>
                    <input type="date" id="fDate">
                </div>
                <div class="form-field">
                    <label>Channel *</label>
                    <select id="fChannel">
                        <option value="">Select channel</option>
                        <option value="D2C_WEBSITE">D2C Website</option>
                        <option value="MYNTRA">Myntra</option>
                        <option value="AJIO">Ajio</option>
                        <option value="NYKAA">Nykaa Fashion</option>
                        <option value="INSTAGRAM">Instagram / Social</option>
                        <option value="POPUP">Pop-up / Offline</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Drop</label>
                    <select id="fDropNew">
                        <option value="">No drop</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Section</label>
                    <select id="fSection">
                        <option value="">—</option>
                        <option value="Regulars">Regulars</option>
                        <option value="Artwear">Artwear</option>
                        <option value="Collectibles">Collectibles</option>
                    </select>
                </div>
            </div>

            <!-- Revenue -->
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">Revenue</p>
                <div class="form-row">
                    <div class="form-field">
                        <label>Gross Sales (₹) *</label>
                        <input type="number" id="fGross" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Returns Amount (₹)</label>
                        <input type="number" id="fReturns" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Gross Units</label>
                        <input type="number" id="fGrossUnits" min="0" placeholder="0">
                    </div>
                    <div class="form-field">
                        <label>Returned Units</label>
                        <input type="number" id="fReturnedUnits" min="0" placeholder="0">
                    </div>
                </div>
            </div>

            <!-- Deductions -->
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">Deductions (optional)</p>
                <div class="form-row">
                    <div class="form-field">
                        <label>Marketplace Commission (₹)</label>
                        <input type="number" id="fCommission" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Payment Gateway (₹)</label>
                        <input type="number" id="fGateway" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>Shipping Collected (₹)</label>
                        <input type="number" id="fShipping" min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>
            </div>

            <!-- GST -->
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">GST Collected (optional)</p>
                <div class="form-row">
                    <div class="form-field">
                        <label>CGST (₹)</label>
                        <input type="number" id="fCgst" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>SGST (₹)</label>
                        <input type="number" id="fSgst" min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-field">
                        <label>IGST (₹)</label>
                        <input type="number" id="fIgst" min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>
            </div>

            <!-- Settlement -->
            <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">Settlement</p>
                <div class="form-row">
                    <div class="form-field">
                        <label>Settlement Ref</label>
                        <input type="text" id="fSettlementRef" placeholder="Myntra payout ID / Razorpay…">
                    </div>
                    <div class="form-field">
                        <label>Settlement Date</label>
                        <input type="date" id="fSettlementDate">
                    </div>
                    <div class="form-field" style="grid-column:span 2">
                        <label>Notes</label>
                        <input type="text" id="fNotes" placeholder="Remarks, settlement period…">
                    </div>
                </div>
            </div>
        </div>
        <div class="px-6 py-4 border-t border-slate-100 flex gap-3 justify-end sticky bottom-0 bg-white">
            <button onclick="closeAddForm()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm hover:bg-slate-200">Cancel</button>
            <button onclick="submitEntry()" id="modal-submit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">
                <i class="fas fa-check mr-1"></i>Save Entry
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl text-sm font-medium shadow-xl hidden z-50"></div>

<script src="js/session.js" defer></script>
<script src="js/nav.js" defer></script>
<script src="js/search.js" defer></script>
<script>
const fmt  = n => '&#8377;' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
const fmtN = n => Number(n || 0).toLocaleString('en-IN');

const CH_LABELS = {
    D2C_WEBSITE: 'D2C Website', MYNTRA: 'Myntra', AJIO: 'Ajio',
    NYKAA: 'Nykaa', INSTAGRAM: 'Instagram', POPUP: 'Pop-up', OTHER: 'Other'
};

let drops = [];
let editingId = null;
let lastEntries = [];

async function init() {
    const today   = new Date().toISOString().split('T')[0];
    const fyStart = new Date(new Date().getFullYear(), 3, 1).toISOString().split('T')[0];
    document.getElementById('fStart').value = fyStart;
    document.getElementById('fEnd').value   = today;
    document.getElementById('fDate').value  = today;

    try {
        const dr = await fetch('/api/meta/drops', { credentials: 'include' }).then(r => r.json());
        drops = dr.drops || [];
        ['fDrop', 'fDropNew'].forEach(id => {
            const sel = document.getElementById(id);
            drops.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.drop_id;
                opt.textContent = d.drop_name;
                sel.appendChild(opt);
            });
        });
    } catch (_) {}

    // Apply URL params
    const urlParams = new URLSearchParams(location.search);
    const qDropId = urlParams.get('drop_id');
    if (qDropId) {
        const sel = document.getElementById('fDrop');
        if (sel) sel.value = qDropId;
    }

    loadEntries();
}

async function loadEntries() {
    const start = document.getElementById('fStart').value;
    const end   = document.getElementById('fEnd').value;
    const drop  = document.getElementById('fDrop').value;
    let url = `/api/reports/sales?start_date=${start}&end_date=${end}`;
    if (drop) url += `&drop_id=${drop}`;

    try {
        const data    = await fetch(url, { credentials: 'include' }).then(r => r.json());
        const entries = data.entries || [];
        lastEntries = entries;
        renderKPIs(entries);
        renderChannelGrid(entries);
        renderTable(entries);
    } catch (e) {
        document.getElementById('entriesBody').innerHTML =
            `<tr><td colspan="11" class="text-center py-8 text-red-400">Failed to load</td></tr>`;
    }
}

function renderKPIs(entries) {
    let gross = 0, returns = 0, net = 0, gst = 0, units = 0;
    entries.forEach(e => {
        gross   += +e.gross_sales;
        returns += +e.returns_amount;
        net     += +e.net_sales;
        gst     += (+e.cgst_collected + +e.sgst_collected + +e.igst_collected);
        units   += (+e.gross_units - +e.returned_units);
    });
    document.getElementById('kpiGross').innerHTML   = fmt(gross);
    document.getElementById('kpiReturns').innerHTML = fmt(returns);
    document.getElementById('kpiNet').innerHTML     = fmt(net);
    document.getElementById('kpiGst').innerHTML     = fmt(gst);
    document.getElementById('kpiUnits').textContent = fmtN(units);
}

function renderChannelGrid(entries) {
    const ch = {};
    entries.forEach(e => {
        if (!ch[e.channel]) ch[e.channel] = { gross: 0, net: 0, units: 0 };
        ch[e.channel].gross += +e.gross_sales;
        ch[e.channel].net   += +e.net_sales;
        ch[e.channel].units += (+e.gross_units - +e.returned_units);
    });
    const grid    = document.getElementById('channelGrid');
    const maxNet  = Math.max(...Object.values(ch).map(c => c.net), 1);
    const sorted  = Object.entries(ch).sort((a, b) => b[1].net - a[1].net);
    if (!sorted.length) { grid.innerHTML = '<p class="text-sm text-slate-400 col-span-4">No data for this period</p>'; return; }
    grid.innerHTML = sorted.map(([key, val]) => `
        <div class="border border-slate-200 rounded-xl p-4">
            <div class="flex items-center justify-between mb-2">
                <span class="ch-badge ch-${key}">${CH_LABELS[key] || key}</span>
                <span class="text-xs text-slate-400">${fmtN(val.units)} units</span>
            </div>
            <div class="text-lg font-bold text-slate-900">${fmt(val.net)}</div>
            <div class="text-xs text-slate-400 mb-2">Gross ${fmt(val.gross)}</div>
            <div class="ch-bar-track"><div class="ch-bar-fill" style="width:${Math.round(val.net/maxNet*100)}%"></div></div>
        </div>
    `).join('');
}

function renderTable(entries) {
    const tbody = document.getElementById('entriesBody');
    if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="11" class="text-center py-10 text-slate-400">No entries for this period</td></tr>';
        return;
    }
    tbody.innerHTML = entries.map(e => {
        const gst      = +e.cgst_collected + +e.sgst_collected + +e.igst_collected;
        const drop     = e.drop_label || e.drop_name || '—';
        const section  = e.section || '—';
        const isRet    = +e.returns_amount > 0;
        return `<tr>
            <td class="text-slate-500">${e.entry_date || '—'}</td>
            <td><span class="ch-badge ch-${e.channel}">${CH_LABELS[e.channel] || e.channel}</span></td>
            <td class="text-slate-600">${drop !== '—' ? `<a href="drop.html?drop=${encodeURIComponent(drop)}" class="text-indigo-600 hover:underline text-xs">${drop}</a>` : '—'}</td>
            <td class="text-slate-600">${section}</td>
            <td class="tr font-medium">${fmt(e.gross_sales)}</td>
            <td class="tr ${isRet ? 'neg' : 'text-slate-300'}">${isRet ? fmt(e.returns_amount) : '—'}</td>
            <td class="tr pos">${fmt(e.net_sales)}</td>
            <td class="tr text-slate-500">${fmtN(+e.gross_units - +e.returned_units)}</td>
            <td class="tr text-slate-500">${gst > 0 ? fmt(gst) : '—'}</td>
            <td class="text-slate-400 text-xs" style="max-width:120px;overflow:hidden;text-overflow:ellipsis">${e.settlement_ref || '—'}</td>
            <td class="tr whitespace-nowrap">
                <button onclick="editEntry(${e.entry_id})" class="text-slate-400 hover:text-indigo-600 px-1 py-0.5 rounded text-xs transition mr-1" title="Edit"><i class="fas fa-pencil"></i></button>
                <button onclick="deleteEntry(${e.entry_id})" class="text-slate-300 hover:text-red-500 px-1 py-0.5 rounded text-xs transition" title="Delete"><i class="fas fa-times"></i></button>
            </td>
        </tr>`;
    }).join('');
}

function openAddForm() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Record Sales Entry';
    document.getElementById('modal-submit').innerHTML = '<i class="fas fa-check mr-1"></i>Save Entry';
    resetForm();
    document.getElementById('add-modal').classList.remove('hidden');
}

function closeAddForm() {
    document.getElementById('add-modal').classList.add('hidden');
    editingId = null;
    resetForm();
}

function editEntry(id) {
    const e = lastEntries.find(x => x.entry_id === id);
    if (!e) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit Sales Entry';
    document.getElementById('modal-submit').innerHTML = '<i class="fas fa-save mr-1"></i>Update Entry';
    // Populate form
    const set = (fieldId, val) => { const el = document.getElementById(fieldId); if (el) el.value = val ?? ''; };
    set('fDate',          e.entry_date?.split('T')[0] || '');
    set('fChannel',       e.channel || '');
    // find drop by id in the list (drop_id may be stored)
    set('fDropNew',       e.drop_id || '');
    set('fSection',       e.section || '');
    set('fGross',         e.gross_sales || '');
    set('fReturns',       e.returns_amount || '');
    set('fGrossUnits',    e.gross_units || '');
    set('fReturnedUnits', e.returned_units || '');
    set('fCommission',    e.marketplace_commission || '');
    set('fGateway',       e.payment_gateway_charges || '');
    set('fShipping',      e.shipping_collected || '');
    set('fCgst',          e.cgst_collected || '');
    set('fSgst',          e.sgst_collected || '');
    set('fIgst',          e.igst_collected || '');
    set('fSettlementRef', e.settlement_ref || '');
    set('fSettlementDate',e.settlement_date?.split('T')[0] || '');
    set('fNotes',         e.notes || '');
    document.getElementById('add-modal').classList.remove('hidden');
}

async function submitEntry() {
    const channel    = document.getElementById('fChannel').value;
    const gross_sales = document.getElementById('fGross').value;
    if (!channel || !gross_sales) { showToast('Channel and Gross Sales are required'); return; }

    const body = {
        entry_date:             document.getElementById('fDate').value,
        channel,
        drop_id:                document.getElementById('fDropNew').value || null,
        section:                document.getElementById('fSection').value || null,
        gross_sales:            parseFloat(gross_sales),
        returns_amount:         parseFloat(document.getElementById('fReturns').value || 0),
        gross_units:            parseInt(document.getElementById('fGrossUnits').value || 0),
        returned_units:         parseInt(document.getElementById('fReturnedUnits').value || 0),
        marketplace_commission: parseFloat(document.getElementById('fCommission').value || 0),
        payment_gateway_charges:parseFloat(document.getElementById('fGateway').value || 0),
        shipping_collected:     parseFloat(document.getElementById('fShipping').value || 0),
        cgst_collected:         parseFloat(document.getElementById('fCgst').value || 0),
        sgst_collected:         parseFloat(document.getElementById('fSgst').value || 0),
        igst_collected:         parseFloat(document.getElementById('fIgst').value || 0),
        settlement_ref:         document.getElementById('fSettlementRef').value || null,
        settlement_date:        document.getElementById('fSettlementDate').value || null,
        notes:                  document.getElementById('fNotes').value || null
    };

    try {
        const url    = editingId ? `/api/reports/sales/${editingId}` : '/api/reports/sales';
        const method = editingId ? 'PUT' : 'POST';
        const r = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body)
        }).then(r => r.json());
        if (r.success) { showToast(editingId ? 'Entry updated' : 'Entry saved'); closeAddForm(); loadEntries(); }
        else showToast('Error: ' + (r.error || 'unknown'));
    } catch (e) {
        showToast('Error: ' + e.message);
    }
}

function exportCSV() {
    if (!lastEntries.length) { showToast('No entries to export'); return; }
    const start = document.getElementById('fStart').value;
    const end   = document.getElementById('fEnd').value;
    const rows = [
        ['NATI Collective — Sales Export', `${start} to ${end}`],
        [],
        ['Date','Channel','Drop','Section','Gross Sales','Returns','Net Sales','Gross Units','Returned Units','GST Collected','Settlement Ref','Settlement Date','Notes'],
        ...lastEntries.map(e => {
            const gst = +e.cgst_collected + +e.sgst_collected + +e.igst_collected;
            return [
                e.entry_date || '', e.channel || '', e.drop_name || '', e.section || '',
                e.gross_sales || 0, e.returns_amount || 0, e.net_sales || 0,
                e.gross_units || 0, e.returned_units || 0, gst,
                e.settlement_ref || '', e.settlement_date || '', e.notes || ''
            ];
        })
    ];
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `nati-sales-${start}-${end}.csv`; a.click();
    URL.revokeObjectURL(url);
}

async function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    try {
        const r = await fetch(`/api/reports/sales/${id}`, {
            method: 'DELETE', credentials: 'include'
        }).then(r => r.json());
        if (r.success) { showToast('Deleted'); loadEntries(); }
        else showToast('Error: ' + r.error);
    } catch (e) {
        showToast('Error: ' + e.message);
    }
}

function resetForm() {
    ['fChannel','fDropNew','fSection','fReturns','fGrossUnits','fReturnedUnits',
     'fCommission','fGateway','fShipping','fCgst','fSgst','fIgst',
     'fSettlementRef','fSettlementDate','fNotes','fGross'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });
    document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3000);
}

init();
</script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(function() {});
}
